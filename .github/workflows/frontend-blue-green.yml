name: Frontend Blue-Green Deployment

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "k8s/frontend-blue-green/**"
      - ".github/workflows/frontend-blue-green.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/new-event-frontend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build frontend Docker image
        run: |
          docker build -t "$IMAGE" ./frontend

      - name: Push frontend Docker image
        run: |
          docker push "$IMAGE"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/new-event-key.pem
          chmod 600 ~/.ssh/new-event-key.pem

          echo "Testing SSH connection to EC2..."
          nc -vz "${{ secrets.EC2_HOST }}" 22

          echo "Adding EC2 host to known_hosts..."
          ssh-keyscan -T 30 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy blue-green manifests to EC2
        run: |
          scp -i ~/.ssh/new-event-key.pem -r k8s/frontend-blue-green \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/new-event-k8s/

      - name: Deploy using blue-green strategy
        run: |
          ssh -i ~/.ssh/new-event-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "IMAGE='$IMAGE' bash -s" <<'EOF'
          set -e

          export KUBECONFIG=$HOME/.kube/config

          cd ~/new-event-k8s/frontend-blue-green

          echo "Using image: $IMAGE"

          echo "Checking Kubernetes access..."
          kubectl get nodes

          echo "Ensuring blue deployment exists..."
          if ! kubectl get deployment new-event-frontend-blue >/dev/null 2>&1; then
            kubectl apply -f frontend-blue.yaml
          fi

          echo "Ensuring green deployment exists..."
          if ! kubectl get deployment new-event-frontend-green >/dev/null 2>&1; then
            kubectl apply -f frontend-green.yaml
          fi

          echo "Ensuring preview services exist..."
          kubectl apply -f frontend-preview-services.yaml

          echo "Ensuring stable frontend service exists..."
          if ! kubectl get service new-event-frontend-service >/dev/null 2>&1; then
            kubectl apply -f frontend-stable-service.yaml
          fi

          ACTIVE_COLOR=$(kubectl get service new-event-frontend-service -o jsonpath='{.spec.selector.color}')

          if [ -z "$ACTIVE_COLOR" ]; then
            echo "No active color found. Defaulting to blue."
            ACTIVE_COLOR="blue"
            kubectl patch service new-event-frontend-service \
              --type=merge \
              -p '{"spec":{"selector":{"app":"new-event-frontend","color":"blue"}}}'
          fi

          if [ "$ACTIVE_COLOR" = "blue" ]; then
            TARGET_COLOR="green"
            OLD_COLOR="blue"
          else
            TARGET_COLOR="blue"
            OLD_COLOR="green"
          fi

          echo "Active color before deployment: $ACTIVE_COLOR"
          echo "Deploying new image to inactive color: $TARGET_COLOR"
          echo "Old color: $OLD_COLOR"

          echo "Updating target deployment image..."
          kubectl set image deployment/new-event-frontend-$TARGET_COLOR \
            new-event-frontend=$IMAGE

          echo "Scaling target deployment to 1 replica..."
          kubectl scale deployment new-event-frontend-$TARGET_COLOR --replicas=1

          echo "Waiting for target deployment rollout..."
          kubectl rollout status deployment/new-event-frontend-$TARGET_COLOR --timeout=180s

          echo "Running smoke test against target preview service..."
          kubectl run frontend-smoke-test \
            --rm -i \
            --restart=Never \
            --image=curlimages/curl:8.8.0 \
            -- curl -f http://new-event-frontend-$TARGET_COLOR-preview/

          echo "Switching live traffic to $TARGET_COLOR..."

          cat > /tmp/frontend-service-patch.json <<PATCH
          {
            "spec": {
              "selector": {
                "app": "new-event-frontend",
                "color": "$TARGET_COLOR"
              }
            }
          }
          PATCH

          kubectl patch service new-event-frontend-service \
            --type=merge \
            --patch-file /tmp/frontend-service-patch.json

          CURRENT_COLOR=$(kubectl get service new-event-frontend-service -o jsonpath='{.spec.selector.color}')

          echo "Current live color after patch: $CURRENT_COLOR"

          if [ "$CURRENT_COLOR" != "$TARGET_COLOR" ]; then
            echo "Blue-green switch failed. Expected $TARGET_COLOR but got $CURRENT_COLOR"
            exit 1
          fi

          echo "Running smoke test against stable live service..."
          kubectl run frontend-live-smoke-test \
            --rm -i \
            --restart=Never \
            --image=curlimages/curl:8.8.0 \
            -- curl -f http://new-event-frontend-service/

          echo "Keeping old color available for rollback..."
          kubectl scale deployment new-event-frontend-$OLD_COLOR --replicas=1

          echo "Deployment completed successfully."
          echo "Live color is now: $TARGET_COLOR"

          echo "Frontend deployments:"
          kubectl get deployments | grep new-event-frontend

          echo "Frontend pods:"
          kubectl get pods -l app=new-event-frontend --show-labels

          echo "Stable service selector:"
          kubectl get service new-event-frontend-service -o jsonpath='{.spec.selector}'
          echo ""

          echo "Live deployment image:"
          kubectl get deployment new-event-frontend-$TARGET_COLOR \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""
          EOF
