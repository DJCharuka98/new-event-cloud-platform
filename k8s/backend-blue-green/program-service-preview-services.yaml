apiVersion: v1
kind: Service
metadata:
  name: program-service-blue-preview
spec:
  type: ClusterIP
  selector:
    app: program-service
    color: blue
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
