apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service-blue
  labels:
    app: event-service
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
      color: blue
  template:
    metadata:
      labels:
        app: event-service
        color: blue
    spec:
      containers:
        - name: event-service
          image: charukaiit/event-service:v2
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
