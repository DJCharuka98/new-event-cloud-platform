apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service-blue
  labels:
    app: registration-service
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration-service
      color: blue
  template:
    metadata:
      labels:
        app: registration-service
        color: blue
    spec:
      containers:
        - name: registration-service
          image: charukaiit/registration-service:v3
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: LOW_SEAT_LAMBDA_NAME
              value: "low-seat-notification"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
