apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-event-frontend-blue
  labels:
    app: new-event-frontend
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: new-event-frontend
      color: blue
  template:
    metadata:
      labels:
        app: new-event-frontend
        color: blue
    spec:
      containers:
        - name: new-event-frontend
          image: charukaiit/new-event-frontend:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
